name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
  
  # Allow manual trigger via GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # Set up Docker Buildx for advanced features like caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      # Login to Docker Hub using GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # Automatically extract and generate Docker tags
      # e.g., 'latest' and the git commit SHA 'sha-1234567'
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # NOTE: You can change 'mlops-sentiment-api' to your preferred repository name on Docker Hub
          images: ${{ secrets.DOCKER_USERNAME }}/mlops-sentiment-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            
      # Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # MLOps Tip: Use GitHub Actions cache to speed up PyTorch/Dependency builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
